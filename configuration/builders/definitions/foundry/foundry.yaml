---
# Foundry CI settings; see README.md. Plugins aren't listed: the dispatcher
# finds them in Foundry.

# The repository's URL is FOUNDRY_REPO_URL in docker-compose/.env (MariaDB)
# and .env.dev (a fork).
repository:
  branch: main                        # built when Force is given no commit

access:
  force_users: []                     # GitHub usernames allowed to press Force

# Where server packages come from: the mirrors (default) or a CI tarbuildnum,
# picked per version on Force. Pull requests always use the mirrors.
server:
  ci_url: https://ci.mariadb.org      # TEMPORARY: production CI while dev-only
  mirror_url: https://mirror.mariadb.org

# Clones Foundry, finds the plugins, archives the commit, triggers the builds.
dispatcher:
  builder: foundry-trigger-builders
  image: debian12                     # only needs git; runs on the amd64 pool

# Arches missing from the multi-arch manifests: image_suffix goes on the
# worker image tag, base_image_prefix replaces the base image's registry, so
# neither shares a local tag with amd64.
arch:
  x86: { image_suffix: "-386", base_image_prefix: docker.io/i386/, platform: linux/386 }

# UBI reaches the full RHEL repos only through the host's entitlement, so RHEL
# targets must run on RHEL hosts.
rhel_subscription: &rhel_subscription
  - [/etc/pki/entitlement, /run/secrets/etc-pki-entitlement]
  - [/etc/rhsm, /run/secrets/rhsm]

# Targets are named after their MariaDB server builder, minus "<arch>-":
# builder foundry-<arch>-<target>, CI source <ci_url>/<tarbuildnum>/<arch>-<target>/.
# image is the quay worker image tag. rpm/deb targets are built there, then
# installed and tested in base_image, the plain upstream image, with
# base_mounts. Bintars are built and tested in the worker image.
packages:

  rpm:
    repo_file: MariaDB.repo           # published by the CI server builder
    mirror_path: yum                  # <mirror_url>/yum/<version>/<os>/<os_version>/<arch>/
    build_packages: [MariaDB-devel]
    # MariaDB-test only requires /usr/bin/perl; on SUSE that is perl-base,
    # without the Memoize MTR needs.
    test_packages: [MariaDB-server, MariaDB-test, "perl(Memoize)"]
    targets:
      centos-stream9-rpm-autobake:  { image: centosstream9,  arch: [amd64, aarch64],      base_image: quay.io/centos/centos:stream9 }
      centos-stream10-rpm-autobake: { image: centosstream10, arch: [amd64, aarch64],      base_image: quay.io/centos/centos:stream10 }
      rhel-8-rpm-autobake:          { image: rhel8,          arch: [amd64, aarch64],      base_image: registry.access.redhat.com/ubi8/ubi, base_mounts: *rhel_subscription }
      rhel-9-rpm-autobake:          { image: rhel9,          arch: [amd64, aarch64],      base_image: registry.access.redhat.com/ubi9/ubi, base_mounts: *rhel_subscription }
      rhel-10-rpm-autobake:         { image: rhel10,         arch: [amd64, aarch64],      base_image: registry.access.redhat.com/ubi10/ubi, base_mounts: *rhel_subscription }
      sles-1507-rpm-autobake:       { image: sles1507,       arch: [amd64],               base_image: registry.suse.com/bci/bci-base:15.7 }
      sles-1600-rpm-autobake:       { image: sles1600,       arch: [amd64],               base_image: registry.suse.com/bci/bci-base:16.0 }
      opensuse-1600-rpm-autobake:   { image: opensuse1600,   arch: [amd64],               base_image: docker.io/opensuse/leap:16.0 }

  deb:
    repo_file: mariadb.sources        # published by the CI server builder
    mirror_path: repo                 # <mirror_url>/repo/<version>/<os> <codename> main
    build_packages: [libmariadb-dev]
    test_packages: [mariadb-server, mariadb-test]
    targets:
      debian-12-deb-autobake:       { image: debian12,       arch: [amd64, aarch64, x86], base_image: docker.io/library/debian:12 }
      debian-13-deb-autobake:       { image: debian13,       arch: [amd64, aarch64],      base_image: docker.io/library/debian:13 }
      ubuntu-2204-deb-autobake:     { image: ubuntu22.04,    arch: [amd64, aarch64],      base_image: docker.io/library/ubuntu:22.04 }
      ubuntu-2404-deb-autobake:     { image: ubuntu24.04,    arch: [amd64, aarch64],      base_image: docker.io/library/ubuntu:24.04 }
      ubuntu-2604-deb-autobake:     { image: ubuntu26.04,    arch: [amd64, aarch64],      base_image: docker.io/library/ubuntu:26.04 }

  # Built against an unpacked server bintar. centos7 up to 11.4, almalinux8
  # from 11.8.
  bintar:
    mirror_bintar: bintar-linux-systemd-x86_64   # the only flavour mirrored, hence amd64 only
    targets:
      centos-7-bintar:              { image: centos7-bintar,    arch: [amd64] }
      almalinux-8-bintar:           { image: almalinux8-bintar, arch: [amd64] }

# targets: built on every run; each must be on the mirrors for that version.
# ci_only: platforms on CI but not on the mirrors yet; built only when Force
# picks a CI tarbuildnum. Move them to targets once a release is mirrored.
# A version not on the mirrors at all, e.g. a new series, has only ci_only
# (see 13.3 below): Force offers it a CI tarbuildnum or skip, and skips it by
# default; pull requests skip it.
mariadb_versions:

  "11.4":
    targets:
      - centos-stream9-rpm-autobake
      - centos-stream10-rpm-autobake
      - rhel-8-rpm-autobake
      - rhel-9-rpm-autobake
      - rhel-10-rpm-autobake
      - debian-12-deb-autobake
      - ubuntu-2204-deb-autobake
      - ubuntu-2404-deb-autobake
      - centos-7-bintar
    ci_only: []

