---
# Plugins are NOT listed here. Foundry registers one plugin per top-level
# directory containing a CMakeLists.txt, and the dispatcher builder clones
# the repo and discovers them at runtime (DiscoverFoundryPlugins in
# configuration/steps/commands/foundry.py), so adding a plugin to Foundry is
# all it takes to get it built. For a pull request only the plugins it
# touches are built. The whole list is then handed to one
# "cmake -P run.cmake <plugin>..." per builder.
#
# Foundry package builders: one builder per (package, arch) combination.
# "version" + "ops" concatenate to the docker image tag (see os_info.yaml),
# e.g. ops: ubuntu, version: "22.04" -> image "ubuntu22.04".
# "os_info_key" is the matching top-level key in os_info.yaml -- it's used to
# derive the real MariaDB server autobake builder name
# ("{arch}-{os_info_key}-{type}-autobake", see constants.py) that publishes
# the MariaDB.repo/mariadb.sources file we install -devel packages from. It
# doesn't always match "{ops}-{version}" (e.g. centos-stream9, ubuntu-2204).
packages:
  - ops: centosstream
    version: "9"
    type: rpm
    os_info_key: centos-stream9
    arch: [amd64, aarch64]
  - ops: centosstream
    version: "10"
    type: rpm
    os_info_key: centos-stream10
    arch: [amd64, aarch64]
  - ops: rhel
    version: "8"
    type: rpm
    os_info_key: rhel-8
    arch: [amd64, aarch64]
  - ops: rhel
    version: "9"
    type: rpm
    os_info_key: rhel-9
    arch: [amd64, aarch64]
  - ops: rhel
    version: "10"
    type: rpm
    os_info_key: rhel-10
    arch: [amd64, aarch64]
  - ops: debian
    version: "11"
    type: deb
    os_info_key: debian-11
    arch: [amd64, aarch64]
  - ops: debian
    version: "12"
    type: deb
    os_info_key: debian-12
    arch: [amd64, aarch64, x86]
  - ops: debian
    version: "13"
    type: deb
    os_info_key: debian-13
    arch: [amd64, aarch64]
  - ops: ubuntu
    version: "22.04"
    type: deb
    os_info_key: ubuntu-2204
    arch: [amd64, aarch64]
  - ops: ubuntu
    version: "24.04"
    type: deb
    os_info_key: ubuntu-2404
    arch: [amd64, aarch64]
  - ops: ubuntu
    version: "26.04"
    type: deb
    os_info_key: ubuntu-2604
    arch: [amd64, aarch64]
  # sles/opensuse images only exist for amd64 -- see os_info.yaml.
  - ops: sles
    version: "1507"
    type: rpm
    os_info_key: sles-1507
    arch: [amd64]
  - ops: sles
    version: "1600"
    type: rpm
    os_info_key: sles-1600
    arch: [amd64]
  - ops: opensuse
    version: "1600"
    type: rpm
    os_info_key: opensuse-1600
    arch: [amd64]
  # Bintar builds: the plugin is built against a MariaDB server bintar
  # instead of installed -devel packages -- see autobake.bintar. Only one
  # image builds bintars per MariaDB version range: centos7 up to 11.4,
  # almalinux8 from 11.8 on (see mariadb_versions below).
  # "ci_bintar_builder" names the ci.mariadb.org builder publishing the
  # bintar for this image under the dispatched tarbuildnum; it's unused on
  # mirror-sourced runs, which take the GA release bintar (a single
  # linux-systemd-x86_64 tarball, the same one for every builder). x86_64
  # only, hence arch: [amd64].
  - ops: centos
    version: "7-bintar"
    type: bintar
    ci_bintar_builder: amd64-centos-7-bintar
    arch: [amd64]
  - ops: almalinux
    version: "8-bintar"
    type: bintar
    ci_bintar_builder: amd64-almalinux-8-bintar
    arch: [amd64]

# Supported MariaDB versions: which packages get built for each. Add or
# remove a version here to change both what "foundry-trigger-builders"
# dispatches and what foundry_force_scheduler asks about.
#
# Where the server packages come from is no longer pinned here -- the force
# scheduler asks per version, offering "use the MariaDB Server mirrors" (the
# default), "use a ci.mariadb.org tarball" (with a tarbuildnum to go with it)
# or "skip this version". See sources.py.
#
# The version key doubles as the mirror path segment, so it has to be a
# directory published under https://mirror.mariadb.org/repo/ (deb) and
# https://mirror.mariadb.org/yum/ (rpm), with a matching mariadb-<version>.<z>
# GA release at https://mirror.mariadb.org/ for the bintar builders -- and
# each package listed for it has to be one the mirrors carry for that version.
# Those differ per branch: 11.4 has no sles-15.7/16.0 or opensuse-16.0 repo,
# while 11.8 does, which is why the SUSE packages are only listed from 11.8 on.
mariadb_versions:
  "11.4":
    packages:
      - centosstream-9
      - centosstream-10
      - rhel-8
      - rhel-9
      - rhel-10
      - debian-11
      - debian-12
      - ubuntu-22.04
      - ubuntu-24.04
      - centos-7-bintar
  # "11.8":
  #   packages:
  #     - centosstream-9
  #     - centosstream-10
  #     - rhel-8
  #     - rhel-9
  #     - rhel-10
  #     - debian-11
  #     - debian-12
  #     - debian-13
  #     - ubuntu-22.04
  #     - ubuntu-24.04
  #     - ubuntu-26.04
  #     - sles-1507
  #     - sles-1600
  #     - opensuse-1600
  #     - almalinux-8-bintar
